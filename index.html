    <script>
      // Prevent benign third-party browser extension errors from cluttering the console
      window.addEventListener('error', function(event) {
        if (event && event.message && event.message.includes('Could not establish connection')) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('Could not establish connection')) {
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>

  </body>
