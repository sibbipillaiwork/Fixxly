<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- Tape Roll Outer -->
  <circle cx="100" cy="100" r="70" fill="url(#tapeGrad)" stroke="#334155" stroke-width="3"/>
  <!-- Inner Cutout -->
  <circle cx="100" cy="100" r="40" fill="url(#coreGrad)" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="100" cy="100" r="32" fill="#f8fafc"/>
  <!-- Brand Band -->
  <path d="M 50 100 A 50 50 0 0 1 150 100" fill="none" stroke="#e11d48" stroke-width="8" stroke-dasharray="14 6"/>
  <!-- Steelgrip Label -->
  <text x="100" y="88" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">STEELGRIP</text>
  <text x="100" y="120" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748b" text-anchor="middle">FR PVC TAPE</text>
</svg>
