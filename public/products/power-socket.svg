<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- Modular Plate -->
  <rect x="35" y="35" width="130" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
  <!-- Bevel Ring -->
  <circle cx="100" cy="100" r="48" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Earth Pin Top -->
  <circle cx="100" cy="74" r="8" fill="#1e293b"/>
  <!-- Live and Neutral Pins -->
  <circle cx="78" cy="112" r="6" fill="#1e293b"/>
  <circle cx="122" cy="112" r="6" fill="#1e293b"/>
  <!-- 6A smaller pin holes -->
  <circle cx="85" cy="100" r="4" fill="#334155"/>
  <circle cx="115" cy="100" r="4" fill="#334155"/>
  <!-- Shutter Safety indicator -->
  <rect x="74" y="128" width="52" height="4" rx="2" fill="#ef4444"/>
  <text x="100" y="152" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="1">ROMA 16A</text>
</svg>
