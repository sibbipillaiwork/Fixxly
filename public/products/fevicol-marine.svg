<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </radialGradient>
    <linearGradient id="mBucketShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="mBucketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#047857" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#mBg)"/>

  <g filter="url(#mBucketShadow)" transform="translate(70, 45)">
    <!-- Wire Handle -->
    <path d="M 20 120 C 20 20, 240 20, 240 120" fill="none" stroke="#94a3b8" stroke-width="4"/>

    <!-- Marine Green Lid Rim -->
    <rect x="25" y="50" width="210" height="24" rx="10" fill="#047857" stroke="#065f46" stroke-width="2"/>
    <rect x="35" y="42" width="190" height="12" rx="6" fill="#059669"/>

    <!-- Bucket Body -->
    <path d="M 35 70 L 50 250 C 55 270, 205 270, 210 250 L 225 70 Z" fill="url(#mBucketShine)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Marine Green Curved Wave -->
    <path d="M 40 120 Q 130 150, 220 120 L 215 200 Q 130 230, 45 200 Z" fill="#047857"/>

    <!-- Iconic Elephant Symbol in White -->
    <circle cx="110" cy="150" r="14" fill="#ffffff"/>
    <circle cx="150" cy="150" r="14" fill="#ffffff"/>
    <rect x="110" y="146" width="40" height="8" rx="3" fill="#ffffff"/>

    <!-- Text Labels -->
    <text x="130" y="185" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">FEVICOL</text>
    <text x="130" y="218" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="900" fill="#34d399" text-anchor="middle">MARINE</text>
    <text x="130" y="238" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="800" fill="#065f46" text-anchor="middle">WATERPROOF WOOD ADHESIVE</text>
  </g>

  <!-- Spec Badge -->
  <rect x="90" y="340" width="220" height="30" rx="15" fill="#065f46"/>
  <text x="200" y="360" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1 KG WATERPROOF BUCKET</text>
</svg>
