<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#f8fafc" rx="16"/>
  <!-- Heavy Sack Bag Body -->
  <path d="M 50 45 Q 100 40 150 45 L 155 160 Q 100 166 45 160 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
  <!-- Top stitched seam -->
  <line x1="48" y1="48" x2="152" y2="48" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 3"/>
  <!-- Bottom stitched seam -->
  <line x1="45" y1="157" x2="155" y2="157" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 3"/>
  <!-- UltraTech Brand Chevron Block -->
  <rect x="62" y="70" width="76" height="60" rx="6" fill="#1e293b"/>
  <polygon points="100,74 130,100 115,100 100,88 85,100 70,100" fill="#eab308"/>
  <text x="100" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">UltraTech</text>
  <text x="100" y="125" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">SUPER OPC 53</text>
  <text x="100" y="148" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#713f12" text-anchor="middle">50 kg NETT</text>
</svg>
