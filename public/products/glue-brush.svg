<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="brushBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="metalFerrule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bristles" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="brushShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#brushBg)"/>

  <g filter="url(#brushShadow)" transform="translate(100, 20)">
    <!-- Wooden Ergonomic Handle -->
    <path d="M 90 20 C 85 20, 75 35, 75 70 C 75 110, 85 130, 85 170 C 85 185, 80 195, 70 205 L 130 205 C 120 195, 115 185, 115 170 C 115 130, 125 110, 125 70 C 125 35, 115 20, 110 20 Z" fill="url(#woodHandle)" stroke="#b45309" stroke-width="2"/>

    <!-- Hole in Handle -->
    <circle cx="100" cy="50" r="7" fill="#ffffff" stroke="#92400e" stroke-width="2"/>

    <!-- Stainless Steel Ferrule Collar -->
    <rect x="55" y="200" width="90" height="45" rx="4" fill="url(#metalFerrule)" stroke="#64748b" stroke-width="2"/>
    <!-- Rivets on Ferrule -->
    <circle cx="70" cy="222" r="3" fill="#334155"/>
    <circle cx="100" cy="222" r="3" fill="#334155"/>
    <circle cx="130" cy="222" r="3" fill="#334155"/>
    <line x1="58" y1="210" x2="142" y2="210" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Dense Pure Synthetic Bristles -->
    <path d="M 52 245 L 48 315 C 48 322, 55 328, 62 328 L 138 328 C 145 328, 152 322, 152 315 L 148 245 Z" fill="url(#bristles)"/>
    <!-- Bristle texture lines -->
    <line x1="62" y1="248" x2="60" y2="325" stroke="#475569" stroke-width="1.5"/>
    <line x1="75" y1="248" x2="74" y2="325" stroke="#64748b" stroke-width="1"/>
    <line x1="88" y1="248" x2="88" y2="325" stroke="#475569" stroke-width="1.5"/>
    <line x1="100" y1="248" x2="100" y2="325" stroke="#64748b" stroke-width="1"/>
    <line x1="112" y1="248" x2="112" y2="325" stroke="#475569" stroke-width="1.5"/>
    <line x1="125" y1="248" x2="126" y2="325" stroke="#64748b" stroke-width="1"/>
    <line x1="138" y1="248" x2="140" y2="325" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Spec Badge -->
  <rect x="90" y="352" width="220" height="30" rx="15" fill="#0b1d3a"/>
  <text x="200" y="372" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2.5" GLUE &amp; PAINT BRUSH</text>
</svg>
