  <line x1="65" y1="45" x2="65" y2="87" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="85" y1="45" x2="85" y2="87" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="105" y1="45" x2="105" y2="87" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <line x1="125" y1="45" x2="125" y2="87" stroke="#fb923c" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- Roller Metal Frame -->
