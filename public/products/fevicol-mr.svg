<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mrBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="mrBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="mrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#mrBg)"/>

  <g filter="url(#mrShadow)" transform="translate(130, 30)">
    <!-- Red Nozzle Tip Cap -->
    <polygon points="65,15 75,15 73,50 67,50" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>

    <!-- Red Screw Collar -->
    <rect x="58" y="50" width="24" height="22" rx="4" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="60" y1="58" x2="80" y2="58" stroke="#fca5a5" stroke-width="1"/>
    <line x1="60" y1="64" x2="80" y2="64" stroke="#fca5a5" stroke-width="1"/>

    <!-- Tapered Bottle Neck -->
    <path d="M 50 100 L 90 100 L 82 72 L 58 72 Z" fill="url(#mrBottle)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Squeezable Bottle Body -->
    <path d="M 45 100 C 35 120, 35 240, 48 265 C 55 272, 85 272, 92 265 C 105 240, 105 120, 95 100 Z" fill="url(#mrBottle)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Fevicol MR Blue Label -->
    <rect x="42" y="130" width="56" height="100" rx="6" fill="#1e40af"/>

    <!-- Iconic Yellow Elephants -->
    <circle cx="62" cy="155" r="7" fill="#fbbf24"/>
    <circle cx="78" cy="155" r="7" fill="#fbbf24"/>
    <rect x="62" y="153" width="16" height="4" fill="#fbbf24"/>

    <!-- Label Text -->
    <text x="70" y="176" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">FEVICOL</text>
    <text x="70" y="200" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">MR</text>
    <text x="70" y="218" font-family="Inter, system-ui, sans-serif" font-size="7" font-weight="800" fill="#93c5fd" text-anchor="middle">SQUEEZY</text>
  </g>

  <!-- Spec Badge -->
  <rect x="100" y="345" width="200" height="30" rx="15" fill="#0b1d3a"/>
  <text x="200" y="365" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">100G SQUEEZY BOTTLE</text>
</svg>
