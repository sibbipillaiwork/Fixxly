<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="fkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </radialGradient>
    <linearGradient id="tubeYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="capBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="fkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#fkBg)"/>

  <g filter="url(#fkShadow)" transform="translate(140, 40)">
    <!-- Fine Nozzle Tip -->
    <polygon points="55,20 65,20 63,60 57,60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Blue Threaded Cap -->
    <rect x="48" y="60" width="24" height="28" rx="4" fill="url(#capBlue)" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="52" y1="68" x2="68" y2="68" stroke="#93c5fd" stroke-width="1"/>
    <line x1="52" y1="76" x2="68" y2="76" stroke="#93c5fd" stroke-width="1"/>

    <!-- Tapered Shoulder -->
    <polygon points="35,110 85,110 72,88 48,88" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Cylindrical Yellow Tube Body -->
    <rect x="35" y="110" width="50" height="150" fill="url(#tubeYellow)" stroke="#ca8a04" stroke-width="2"/>

    <!-- Crimp Bottom -->
    <rect x="30" y="260" width="60" height="18" rx="2" fill="#ca8a04" stroke="#a16207" stroke-width="1.5"/>
    <line x1="34" y1="269" x2="86" y2="269" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Vertical Fevikwik Branding -->
    <polygon points="36,130 84,130 84,230 36,230" fill="#1e3a8a"/>
    <text x="60" y="152" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">FEVI</text>
    <text x="60" y="170" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="900" fill="#facc15" text-anchor="middle">KWIK</text>
    <text x="60" y="195" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">ONE DROP</text>
    <text x="60" y="210" font-family="Inter, system-ui, sans-serif" font-size="7" font-weight="800" fill="#93c5fd" text-anchor="middle">INSTANT GLUE</text>
  </g>

  <!-- Spec Badge -->
  <rect x="100" y="345" width="200" height="30" rx="15" fill="#0b1d3a"/>
  <text x="200" y="365" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3G PACK OF 4 TUBES</text>
</svg>
