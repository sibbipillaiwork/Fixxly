<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mtBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
    <linearGradient id="tapeRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="coreCardboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="mtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#b45309" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#mtBg)"/>

  <g filter="url(#mtShadow)" transform="translate(60, 50)">
    <!-- Main Outer Tape Roll 3D perspective -->
    <ellipse cx="140" cy="140" rx="110" ry="85" fill="url(#tapeRoll)" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Outer Side Band for Depth -->
    <path d="M 30 140 C 30 190, 250 190, 250 140 L 250 180 C 250 230, 30 230, 30 180 Z" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
    
    <!-- Peeling Tape Strip -->
    <path d="M 230 170 Q 270 210, 280 250 L 255 255 Q 245 220, 215 180 Z" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>

    <!-- Inner Core Cardboard Tube -->
    <ellipse cx="140" cy="140" rx="60" ry="45" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="140" cy="140" rx="52" ry="38" fill="url(#coreCardboard)"/>

    <!-- Inner Core Text (Brand Print inside core) -->
    <ellipse cx="140" cy="140" rx="46" ry="32" fill="#78350f"/>
    <text x="140" y="144" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="1">PIDILITE</text>
  </g>

  <!-- Spec Badge -->
  <rect x="90" y="345" width="220" height="30" rx="15" fill="#0b1d3a"/>
  <text x="200" y="365" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">24MM X 25M MASKING TAPE</text>
</svg>
